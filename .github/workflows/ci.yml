name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go 质量门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - name: gofmt(格式检查)
        run: test -z "$(gofmt -l .)" || { echo "gofmt 未通过:"; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...
      - name: swagger 生成物漂移检查(spec 未同步则失败)
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1 \
            -config internal/api/gen.cfg.yaml ../openapi.yaml
          git diff --exit-code -- internal/api/gen/oapi.gen.go

  frontend-quality:
    name: 前端质量门禁 + dist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: openapi 客户端生成物漂移检查
        run: |
          npm run gen:api
          git diff --exit-code -- src/schema.d.ts
      - name: typecheck + build(tsc -b && vite build)
        run: npm run build
      - name: 上传前端 dist 产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  docker-image:
    name: 后端 Docker 镜像
    runs-on: ubuntu-latest
    needs: [go-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建后端镜像(不推送)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: sale-sipeed-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
