# 服务器 nginx 样例:前端静态托管 + /api 反代到 docker 内后端。
# 1. 前端:cd frontend && npm run build → dist/ 复制到 /opt/sale-sipeed/dist
# 2. 后端:docker compose up -d(backend 容器仅绑定 127.0.0.1:8080)
# 3. 按需替换 server_name、证书与 ACME 配置(certbot --nginx)

server {
    listen 443 ssl http2;
    server_name sale-sipeed.example.com;

    ssl_certificate     /etc/letsencrypt/live/sale-sipeed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sale-sipeed.example.com/privkey.pem;

    # ---- 前端(Vite 构建产物,SPA)----
    root  /opt/sale-sipeed/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存(带哈希指纹)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 后端 API / webhook:原样转发(保留 /api 前缀,后端路由挂在 /api)----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # webhook 是 Stripe 的低频单请求,无需长超时;保持默认即可
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name sale-sipeed.example.com;
    # 证书自动续期后此块由 certbot 改写;未配置证书前可临时重定向
    location / {
        return 301 https://$host$request_uri;
    }
}
